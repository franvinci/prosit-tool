# The tests, on every push and pull request.
#
# They run with the versions of the dependencies that the release is built
# from (packaging/constraints.txt). Once a week they also run with the newest
# release of every dependency, which is what "pip install prosit-tool" gets
# on that day: a failure there says that one of them has changed.
name: Tests

on:
  push:
    # Not the trial branches: the release workflow runs the tests itself there.
    branches: ['**', '!trial/**']
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Linux is where the tests have been written and must pass. Windows and
    # macOS are run to know how they stand: they do not fail the whole run.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      # On Windows git would otherwise rewrite the line endings of every file.
      - name: Keep the files as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packaging/constraints.txt

      # The tests of the page, and the ones that draw with the library the page uses.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the tool with the tested versions of its dependencies
        run: python -m pip install -c packaging/constraints.txt -e ".[dev]"

      - name: Run the tests
        run: python -m pytest -q

  newest-dependencies:
    name: With the newest dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the tool as pip would today
        run: python -m pip install -e ".[dev]"

      - name: Run the tests
        run: python -m pytest -q
