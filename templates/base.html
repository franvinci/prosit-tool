<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ProSiT - Process Simulation Tool{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">

    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons@4.29.2/dist/feather.min.js"
            integrity="sha384-qEqAs1VsN9WH2myXDbiP2wGGIttL9bMRZBKCl54ZnzpDlVqbYANP9vMaoT/wvQcf"
            crossorigin="anonymous"></script>
    
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar with sessions list -->
        <aside id="appSidebar" class="app-sidebar">
            <div class="sidebar-header">
                <a class="sidebar-brand" href="{{ url_for('index') }}" onclick="event.preventDefault(); newDiscovery();">
                    <i data-feather="shuffle"></i>
                    <span class="brand-text">ProSiT</span>
                </a>
                <button type="button" class="sidebar-toggle" id="sidebarToggleBtn"
                        onclick="toggleSidebar()" title="Toggle sidebar">
                    <i data-feather="chevrons-left" id="sidebarToggleIcon"></i>
                </button>
            </div>
            <div class="sidebar-body">
                <button type="button" class="sidebar-new-discovery" onclick="newDiscovery()" title="Start a new discovery">
                    <i data-feather="plus" style="width: 16px; height: 16px;"></i>
                    <span class="label">New Discovery</span>
                </button>
                <div class="sidebar-section-title">Recent Sessions</div>
                <div class="sidebar-sessions" id="sidebarSessionsContainer">
                    {% block sidebar_sessions %}{% endblock %}
                </div>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

        <div class="app-main">
            <!-- Sticky Run Simulation toolbar (visible only when a session is active) -->
            <div id="stickyRunBar" class="sticky-run-bar" style="display: none;">
                <div class="container-fluid d-flex flex-wrap align-items-center justify-content-end gap-2 px-3">
                    <div class="input-group input-group-sm" style="width: auto;">
                        <span class="input-group-text">Instances</span>
                        <input type="number" id="stickyNumInstances" class="form-control" style="max-width: 90px;"
                               min="1" max="10000" value="100">
                    </div>
                    <div class="input-group input-group-sm" style="width: auto;">
                        <span class="input-group-text">Start</span>
                        <input type="datetime-local" id="stickyStartTimestamp" class="form-control" style="max-width: 200px;">
                    </div>
                    <button type="button" class="btn btn-sm sticky-run-btn"
                            id="stickyRunBtn"
                            onclick="runSimulationFromSticky()">
                        <i data-feather="play" class="me-1" style="width: 14px; height: 14px;"></i>
                        <span id="stickyRunBtnLabel">Run Simulation</span>
                    </button>
                    <div class="dropdown">
                        <button type="button"
                                id="stickyDownloadBtn"
                                class="btn btn-sm btn-outline-success dropdown-toggle"
                                data-bs-toggle="dropdown" aria-expanded="false"
                                disabled>
                            <i data-feather="download" class="me-1" style="width: 14px; height: 14px;"></i>
                            Download
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><button type="button" class="dropdown-item" onclick="downloadSimulation('csv')">CSV</button></li>
                            <li><button type="button" class="dropdown-item" onclick="downloadSimulation('xes')">XES</button></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <main>
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center py-4">
                    <div class="spinner-border text-primary mb-3" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <h5 id="loadingMessage">Processing...</h5>
                    <p class="text-muted mb-0" id="loadingDetail">Please wait while we process your request.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 1100;"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>

    <!-- Chart.js + matrix plugin (used by the resource utilization heatmap) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js"
            crossorigin="anonymous"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <!-- Initialize Feather Icons -->
    <script>
        feather.replace();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
