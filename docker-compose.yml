services:
  prosit-app:
    build: .
    ports:
      - "5050:5050"
    environment:
      # Inside a container the server must accept connections from outside it,
      # and there is no browser to open.
      - PROSIT_TOOL_HOST=0.0.0.0
      - PROSIT_TOOL_NO_BROWSER=1
    volumes:
      - ./uploads:/app/uploads
      - ./simulations:/app/simulations
      - ./instance:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
