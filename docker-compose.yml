# ProSiT Tool with Docker Compose.
#
#   docker compose up -d      start it, then open http://localhost:5050
#   docker compose down       stop it
#
# The first start downloads the published image. From a source checkout,
# "docker compose up -d --build" builds the image from the sources instead.
services:
  prosit-app:
    image: ghcr.io/franvinci/prosit-tool:latest
    build: .
    ports:
      # Reachable from this computer only. The tool has no login: whoever can
      # reach it can read and delete its data. To let the other computers of
      # the network in all the same, write "5050:5050".
      - "127.0.0.1:5050:5050"
    volumes:
      # Uploaded logs, simulated logs and the database stay in these three
      # folders, next to this file.
      - ./uploads:/data/uploads
      - ./simulations:/data/simulations
      - ./instance:/data/instance
    restart: unless-stopped
