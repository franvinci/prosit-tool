services:
  prosit-app:
    build: .
    ports:
      - "5050:5050"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///prosit.db
    volumes:
      - ./uploads:/app/uploads
      - ./simulations:/app/simulations
      - ./instance:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
