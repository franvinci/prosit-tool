<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ProSiT - Process Simulation Tool{% endblock %}</title>
    
    <!-- The libraries are served by the tool itself (static/vendor): it works with no network. -->
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='vendor/feather-icons/feather.min.js') }}"></script>
    
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <i data-feather="shuffle" class="me-2"></i>
                ProSiT
            </a>
            <span class="navbar-text text-light opacity-75">
                Process Simulation Tool
            </span>
        </div>
    </nav>

    <!-- Sticky Run Simulation toolbar (visible only when a session is active) -->
    <div id="stickyRunBar" class="sticky-run-bar" style="display: none;">
        <div class="container-fluid d-flex flex-wrap align-items-center justify-content-end gap-2 px-3">
            <div class="input-group input-group-sm" style="width: auto;">
                <span class="input-group-text">Instances</span>
                <input type="number" id="stickyNumInstances" class="form-control" style="max-width: 90px;"
                       min="1" max="10000" value="100">
            </div>
            <div class="input-group input-group-sm" style="width: auto;">
                <span class="input-group-text">Start</span>
                <input type="datetime-local" id="stickyStartTimestamp" class="form-control" style="max-width: 200px;">
            </div>
            <button type="button" class="btn btn-sm sticky-run-btn"
                    id="stickyRunBtn"
                    data-action="run-simulation-sticky">
                <i data-feather="play" class="me-1" style="width: 14px; height: 14px;"></i>
                <span id="stickyRunBtnLabel">Run Simulation</span>
            </button>
            <div class="dropdown">
                <button type="button"
                        id="stickyDownloadBtn"
                        class="btn btn-sm btn-outline-success dropdown-toggle"
                        data-bs-toggle="dropdown" aria-expanded="false"
                        disabled>
                    <i data-feather="download" class="me-1" style="width: 14px; height: 14px;"></i>
                    Download
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><button type="button" class="dropdown-item" data-action="download-simulation" data-format="csv">CSV</button></li>
                    <li><button type="button" class="dropdown-item" data-action="download-simulation" data-format="xes">XES</button></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center py-4">
                    <div class="spinner-border text-primary mb-3" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <h5 id="loadingMessage">Processing...</h5>
                    <p class="text-muted mb-0" id="loadingDetail">Please wait while we process your request.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 1100;"></div>

    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
    <!-- Chart.js and its matrix plugin (the heatmap of the resource utilization) -->
    <script src="{{ url_for('static', filename='vendor/chart.js/chart.umd.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/chartjs-chart-matrix/chartjs-chart-matrix.min.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
